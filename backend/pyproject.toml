[project]
name = "llb-back"
version = "0.1.0"
description = "llb-back"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "another-fastapi-jwt-auth>=0.1.6",
    "bcrypt<4.1",
    "fastapi>=0.121.1",
    "httpx>=0.28.1",
    "passlib>=1.7.4,<2.0",
    "pydantic-settings>=2.12.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.44",
    "uvicorn>=0.38.0",
]

# ============================================================================
# RUFF
# ============================================================================
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort (сортировка импортов)
    "UP",   # pyupgrade
]

[dependency-groups]
dev = [
    "pre-commit>=4.4.0",
    "rich>=14.2.0",
]
