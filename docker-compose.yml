services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    volumes:
      - ./backend/llm.db:/app/llm.db
    ports:
      - "8000:8000"
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    env_file:
      - bot/.env
    environment:
      DATABASE_PATH: /data/llm.db
    volumes:
      - ./backend/llm.db:/data/llm.db
      - ./bot/temp_files:/app/temp_files
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file:
      - frontend/.env
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

