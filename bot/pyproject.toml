[project]
name = "llb-bot"
version = "0.1.0"
description = "llb-bot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiogram==3.10.0",
    "openai>=1.0.0",
    "PyMuPDF==1.24.4",
    "python-dotenv==1.0.1",
    "aiohttp==3.9.5",
    "aiosqlite",
]

# ============================================================================
# RUFF
# ============================================================================
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort (сортировка импортов)
    "UP",   # pyupgrade
]

[dependency-groups]
dev = [
    "pre-commit>=4.4.0",
    "rich>=14.2.0",
]

[project.scripts]
bot = "main:main"

